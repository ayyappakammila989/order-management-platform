# Local infrastructure for the OMS learning project.
# Nothing starts without a profile. Start only what the current step needs:
#   docker compose --profile db up -d          # PostgreSQL only
#   docker compose --profile cache up -d       # Redis only
#   docker compose --profile auth up -d        # Keycloak (+ the PostgreSQL it needs)
#   docker compose --profile foundation up -d  # everything step 1 needs
#   docker compose --profile kafka up -d       # Kafka (KRaft) + Schema Registry + Kafka UI
#   docker compose --profile cdc up -d         # Kafka + Schema Registry + Kafka Connect/Debezium + PostgreSQL
#   docker compose --profile search up -d     # Elasticsearch only (order-query-service)
#   docker compose --profile kibana up -d     # Kibana (+ Elasticsearch); optional, to look at the index
#   docker compose --profile tax-stub up -d   # WireMock standing in for tax-service (pricing-service)
#   docker compose --profile payments up -d   # stripe-mock + PayPal WireMock stub (payment-gateway-adapter)
#   docker compose --profile order-core up -d  # everything steps 2-3 need (foundation + kafka + cdc + search + stubs)
# Stop:  docker compose --profile <name> down      (add -v to delete data - ask first)
#
# Memory budget (Docker Desktop has 8 GB): every container has mem_limit and every JVM a capped heap.
#   postgres 384m + redis 128m + keycloak 1g                                   = foundation ~1.5 GB
#   kafka 1g + schema-registry 512m + kafka-connect 1g + kafka-ui 512m         = +3 GB
#   elasticsearch 1280m + wiremock 256m                                        = +1.5 GB
#   stripe-mock 128m + paypal wiremock 256m                                    = +0.4 GB (order-core ~6.4 GB of limits)
#   kibana 1g only with the kibana profile (not in order-core): start it when you want to browse the index.
name: oms

services:
  postgres:
    image: postgres:17-alpine
    container_name: oms-postgres
    profiles: [db, auth, foundation, cdc, order-core]
    # logical WAL lets Debezium read committed changes (the outbox table) from the write-ahead log
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432"          # host 5432 and 5433 are taken by other Postgres instances
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
      - ./infra/postgres/debezium-user.sql:/docker-entrypoint-initdb.d/debezium-user.sql.inc:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 384m

  redis:
    image: redis:7-alpine
    container_name: oms-redis
    profiles: [cache, foundation, order-core]
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: oms-keycloak
    profiles: [auth, foundation, order-core]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["start-dev", "--import-realm"]   # imports realms from /opt/keycloak/data/import only if they do not exist yet
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/oms_keycloak
      KC_DB_USERNAME: oms_keycloak
      KC_DB_PASSWORD: oms_keycloak
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8180:8080"          # 8080 is reserved for api-gateway on the host
      - "9000:9000"          # management: /health, /metrics
    volumes:
      - ./infra/keycloak/oms-realm.json:/opt/keycloak/data/import/oms-realm.json:ro
    healthcheck:
      # image has no curl; open a TCP connection to the management port and read the readiness endpoint
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    mem_limit: 1g

  kafka:
    image: apache/kafka:4.3.2
    container_name: oms-kafka
    profiles: [kafka, cdc, order-core]
    environment:
      # single node in KRaft mode: the same process is broker and controller, no ZooKeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL for other containers (kafka:29092), EXTERNAL for apps on the host (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # topics are created on purpose (by Debezium's topic.creation settings or scripts), so a typo fails loudly
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      # the image's default is /tmp/kraft-combined-logs inside the container: without this the volume stays empty and
      # all topics (and Kafka Connect's stored connector config) vanish whenever the container is re-created
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s
    mem_limit: 1g

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.4
    container_name: oms-schema-registry
    profiles: [kafka, cdc, order-core]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward    # new schema must read old data
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    mem_limit: 512m

  kafka-connect:
    image: quay.io/debezium/connect:3.6.2.Final
    container_name: oms-kafka-connect
    profiles: [cdc, order-core]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: oms-connect
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/connectors >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 1g

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    container_name: oms-kafka-ui
    profiles: [kafka, order-core]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: oms-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      JAVA_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "8090:8080"
    mem_limit: 512m

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19
    container_name: oms-elasticsearch
    profiles: [search, kibana, order-core]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"      # local only; real environments turn security on
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      cluster.routing.allocation.disk.threshold_enabled: "false"   # a nearly full laptop disk must not turn the index read-only
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    mem_limit: 1280m     # 512m heap + off-heap; measured 913-977 MiB, so 1g was too tight

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.19
    container_name: oms-kibana
    profiles: [kibana]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      NODE_OPTIONS: "--max-old-space-size=512"
      TELEMETRY_OPTIN: "false"
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:5601/api/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 1g

  # Stands in for tax-service until it is built: answers POST /internal/v1/tax/calculate from files in infra/wiremock/tax
  tax-stub:
    image: wiremock/wiremock:3.13.2
    container_name: oms-tax-stub
    profiles: [tax-stub, order-core]
    command: ["--global-response-templating", "--disable-gzip", "--verbose"]
    ports:
      - "8190:8080"
    volumes:
      - ./infra/wiremock/tax:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/__admin/mappings >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  # --- step 3B: payment gateways (mocks) ---
  # Stands in for Stripe (test mode): the official stripe-mock, stateless. It validates requests against Stripe's
  # OpenAPI spec and answers fixture objects (amount/currency echoed, status fixed), so it never declines and never
  # sends webhooks; payment-gateway-adapter is configured for that (oms.gateway.stripe.mock-mode).
  stripe-mock:
    image: stripe/stripe-mock:v0.206.0
    container_name: oms-stripe-mock
    profiles: [payments, order-core]
    ports:
      - "12111:12111"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --header 'Authorization: Bearer sk_test_123' http://localhost:12111/v1/payment_methods/pm_card_visa"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m

  # Stands in for PayPal REST (OAuth2, Orders v2 authorize, capture/void/refund, webhook signature verification).
  # Order ids starting with PAYPAL-DECLINE / PAYPAL-SLOW / PAYPAL-DOWN give a decline, a 15 s answer and a 503.
  paypal-stub:
    image: wiremock/wiremock:3.13.2
    container_name: oms-paypal-stub
    profiles: [payments, order-core]
    command: ["--disable-gzip", "--verbose"]
    ports:
      - "8191:8080"
    volumes:
      - ./infra/wiremock/paypal:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/__admin/mappings >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  elasticsearch-data:
