server:
  port: 8103

spring:
  application:
    name: pricing-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:postgresql://localhost:5434/oms_pricing
    username: oms_pricing
    password: oms_pricing
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms            # Redis is only a cache here: when it is slow or down we read the database
      connect-timeout: 1s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/oms
          jwk-set-uri: http://localhost:8180/realms/oms/protocol/openid-connect/certs
  cloud:
    openfeign:
      client:
        config:
          tax-service:
            connect-timeout: 1000
            read-timeout: 2000

oms:
  security:
    audience: oms-api
  tax-service:
    # tax-service does not exist yet: WireMock stands in (docker compose --profile tax-stub). Remove the url to use Eureka.
    url: http://localhost:8190
  pricing:
    shipping-flat: 4.99
    free-shipping-from: 75.00
    price-cache-ttl: 10m       # architecture 8: price:{sku}
    promo-cache-ttl: 5m        # promo:active
    tax-cache-ttl: 24h         # tax:{zip}:{taxCode}; also what keeps pricing working when the tax provider is down
    tax-breaker:
      sliding-window-size: 20
      minimum-calls: 10
      failure-rate-threshold: 50
      open-wait: 30s

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  server:
    port: 18103
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
