# Shared by every service that reads from the Config Server.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    lease-renewal-interval-in-seconds: 10      # heartbeat 10s (architecture 6.2)
    lease-expiration-duration-in-seconds: 30   # evicted after 30s without heartbeat
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

oms:
  environment: local
