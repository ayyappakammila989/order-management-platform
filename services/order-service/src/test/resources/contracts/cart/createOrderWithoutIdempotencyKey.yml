description: Without an Idempotency-Key the order is refused, so a retry can never create a second order.
name: create_order_without_idempotency_key
request:
  method: POST
  url: /internal/v1/orders
  headers:
    Content-Type: application/json
  body:
    customerId: cust-1
    channel: WEB
    currency: USD
    lines:
      - sku: SKU-1
        quantity: 1
        unitPrice: 5.00
        fulfillmentType: SHIP
    shippingAddress:
      name: Jane Doe
      line1: 1 Main St
      city: New York
      state: NY
      zip: "10001"
    shippingTotal: 0.00
response:
  status: 400
  headers:
    Content-Type: application/json
  body:
    status: 400
    errorCode: IDM-400
    message: Idempotency-Key header is required
