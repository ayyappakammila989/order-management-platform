# Shared by every service that reads from the Config Server.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # local runs restart services often: fetch the registry every 5 s (default 30 s), so a restarted service is
    # called again within ~10 s instead of ~65 s (30 s fetch + 35 s load-balancer cache)
    registry-fetch-interval-seconds: 5
  instance:
    lease-renewal-interval-in-seconds: 10      # heartbeat 10s (architecture 6.2)
    lease-expiration-duration-in-seconds: 30   # evicted after 30s without heartbeat
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

oms:
  environment: local

spring:
  cloud:
    loadbalancer:
      cache:
        ttl: 5s                # default 35 s; see registry-fetch-interval-seconds above
